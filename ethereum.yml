name: w3r

services:
  ethereum:
    restart: unless-stopped
    image: ghcr.io/paradigmxyz/reth:v1.1.4
    ports:
      - "9001:9001" # metrics
      - "30303:30303" # eth/66 peering
      - "8545:8545" # rpc
      - "8546:8546"
      - "8551:8551" # engine
    volumes:
      - ${ETHEREUM_STORAGE}/data:/root/.local/share/reth/mainnet
      - ${ETHEREUM_STORAGE}/logs:/root/logs
      - ./jwttoken:/root/jwt:ro
    # https://paradigmxyz.github.io/reth/run/troubleshooting.html#concurrent-database-access-error-using-containersdocker
    pid: host
    command: >
      node
      --chain mainnet
      --metrics 0.0.0.0:9001
      --log.file.directory /root/logs
      --authrpc.addr 0.0.0.0
      --authrpc.port 8551
      --authrpc.jwtsecret /root/jwt/jwt.hex
      --http --http.addr 0.0.0.0 --http.port 8545
      --http.api "eth,net,web3,debug,trace"
      --ws --ws.addr 0.0.0.0  --ws.origins "*" --ws.api "eth,net,web3,debug,trace"
